[project]
name = "feishu-cc"
version = "0.1.0"
description = "在飞书里管理本机 Claude Code 会话：启停、对话、斜杠命令、流式回显"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "feishu-cc maintainers" }]
license = { text = "MIT" }

dependencies = [
    "aiohttp>=3.9",      # WebSocket server + 通用 HTTP
    "lark-oapi>=1.4",    # 飞书开放平台 SDK
    "anyio>=4.2",        # 跨平台 asyncio 工具（subprocess、tasks）
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
feishu-cc-server = "server.main:main"
feishu-cc-bridge = "bridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "bridge"]
